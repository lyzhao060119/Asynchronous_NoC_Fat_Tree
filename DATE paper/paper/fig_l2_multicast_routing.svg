<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#17212e}.section{font:700 25px Arial,sans-serif;fill:#17212e}
      .label{font:22px Arial,sans-serif;fill:#263545}.small{font:18px Arial,sans-serif;fill:#405267}
      .code{font:20px 'Consolas','Courier New',monospace;fill:#17212e}.codehead{font:700 23px Arial,sans-serif;fill:#17212e}
      .level{font:700 28px Arial,sans-serif;fill:#526273}.link{fill:none;stroke:#c4cbd3;stroke-width:4}
      .active{fill:none;stroke:#cc2d39;stroke-width:6}.router{fill:#fff;stroke:#9daab7;stroke-width:3}
      .l1{fill:#fff9e7;stroke:#bea360;stroke-width:3}.focus{fill:#fff0f0;stroke:#cc2d39;stroke-width:5}
    </style>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#cc2d39"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#078a83"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="52" y="62" class="title">L2 multicast routing in the three-level hierarchy</text>
  <text x="52" y="101" class="small">The highlighted L2 router has four L1 child ports and one L3 parent port.</text>

  <!-- Full hierarchy retains the structure of the supplied sketch. -->
  <text x="56" y="190" class="level">L3</text><text x="56" y="350" class="level">L2</text><text x="56" y="520" class="level">L1</text>
  <path class="link" d="M454 181 L180 322 M454 181 L356 322 M454 181 L552 322 M454 181 L728 322"/>
  <path class="active" d="M454 181 L356 322"/>
  <circle cx="454" cy="168" r="35" class="router"/><text x="440" y="177" class="label">L3</text>
  <circle cx="180" cy="330" r="34" class="router"/><circle cx="356" cy="330" r="40" class="focus"/>
  <circle cx="552" cy="330" r="34" class="router"/><circle cx="728" cy="330" r="34" class="router"/>
  <text x="343" y="338" class="label" font-weight="700">L2</text>
  <text x="298" y="395" class="small" fill="#cc2d39">focal router</text>
  <path class="link" d="M180 357 L119 478 M180 357 L158 478 M180 357 L202 478 M180 357 L244 478
    M552 357 L490 478 M552 357 L532 478 M552 357 L574 478 M552 357 L616 478
    M728 357 L666 478 M728 357 L708 478 M728 357 L750 478 M728 357 L792 478"/>
  <path class="active" d="M356 369 L290 478 M356 369 L332 478 M356 369 L378 478 M356 369 L422 478"/>
  <g class="l1"><circle cx="119" cy="490" r="19"/><circle cx="158" cy="490" r="19"/><circle cx="202" cy="490" r="19"/><circle cx="244" cy="490" r="19"/>
    <circle cx="290" cy="490" r="19"/><circle cx="332" cy="490" r="19"/><circle cx="378" cy="490" r="19"/><circle cx="422" cy="490" r="19"/>
    <circle cx="490" cy="490" r="19"/><circle cx="532" cy="490" r="19"/><circle cx="574" cy="490" r="19"/><circle cx="616" cy="490" r="19"/>
    <circle cx="666" cy="490" r="19"/><circle cx="708" cy="490" r="19"/><circle cx="750" cy="490" r="19"/><circle cx="792" cy="490" r="19"/></g>
  <text x="272" y="534" class="small">c3</text><text x="313" y="534" class="small">c1</text><text x="360" y="534" class="small">c2</text><text x="403" y="534" class="small">c0</text>
  <text x="475" y="243" class="small">parent, port 4</text>
  <text x="274" y="568" class="small">child ports 0–3 (four L1 regions)</text>

  <!-- The exact route-mask rule, including ingress exclusion. -->
  <rect x="870" y="122" width="675" height="425" rx="15" fill="#f8fafc" stroke="#8ea2b5" stroke-width="2"/>
  <text x="905" y="166" class="codehead">Algorithm: L2 output-port mask</text>
  <text x="905" y="211" class="code">Input: R = rectangle(x0,y0,x1,y1),</text>
  <text x="905" y="244" class="code">       p = ingress port, valid</text>
  <text x="905" y="291" class="code">if !valid: return ∅</text>
  <text x="905" y="337" class="code">for c ∈ {0,1,2,3}:</text>
  <text x="937" y="370" class="code">if overlap(R, childRegion[c])</text>
  <text x="969" y="403" class="code">and p ≠ c: enable child[c]</text>
  <text x="905" y="450" class="code">if p ≠ 4 and !contained(R, L2Region):</text>
  <text x="937" y="483" class="code">enable parent (port 4)</text>
  <text x="905" y="524" class="small">Multiple child outputs and parent may be enabled together.</text>

  <!-- Cases make the child/parent distinction concrete. -->
  <rect x="52" y="609" width="725" height="245" rx="14" fill="#f2faf8" stroke="#8ecbc4" stroke-width="2"/>
  <text x="78" y="650" class="section">A  Local destination rectangle</text>
  <text x="78" y="685" class="small">Ingress: parent (p = 4); R lies wholly in this L2 region.</text>
  <rect x="95" y="714" width="114" height="114" fill="#fff" stroke="#526273" stroke-width="2"/>
  <path d="M152 714 V828 M95 771 H209" stroke="#526273" stroke-width="1.5"/>
  <rect x="113" y="731" width="75" height="26" fill="#a3ded8" stroke="#078a83" stroke-width="2"/>
  <text x="104" y="751" class="small">3</text><text x="178" y="751" class="small">1</text><text x="105" y="806" class="small">2</text><text x="179" y="806" class="small">0</text>
  <text x="243" y="743" class="label">R overlaps child 3 and child 1.</text>
  <text x="243" y="778" class="label">Enabled: child 3, child 1.</text>
  <text x="243" y="813" class="label">Parent disabled: R is contained in L2.</text>

  <rect x="822" y="609" width="723" height="245" rx="14" fill="#fff7f7" stroke="#dea2a8" stroke-width="2"/>
  <text x="848" y="650" class="section">B  Rectangle extends beyond this L2</text>
  <text x="848" y="685" class="small">Ingress: child 3 (p = 3); R overlaps children 3 and 1.</text>
  <rect x="866" y="714" width="114" height="114" fill="#fff" stroke="#526273" stroke-width="2"/>
  <path d="M923 714 V828 M866 771 H980" stroke="#526273" stroke-width="1.5"/>
  <rect x="883" y="699" width="75" height="58" fill="#f4c5c9" stroke="#cc2d39" stroke-width="2"/>
  <text x="877" y="751" class="small">3</text><text x="949" y="751" class="small">1</text><text x="878" y="806" class="small">2</text><text x="951" y="806" class="small">0</text>
  <text x="1014" y="743" class="label">Enabled: child 1 and parent (port 4).</text>
  <text x="1014" y="778" class="label">Child 3 is excluded as the ingress port.</text>
  <text x="1014" y="813" class="label">Parent enabled: R is not contained in L2.</text>
  <text x="52" y="889" class="small">R is the packet-header destination rectangle; port numbering follows RoutingLogic_quadtree.scala (L2 mask).</text>
</svg>
